---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: admin
  namespace: default
  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  # "admin-role" is a name for the ClusterRole
  name: admin-role
rules:
- apiGroups: ["*"] # "" indicates the core API group
  resources: ["*"] #
  verbs: ["*"] # action indicates
  
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: admin-cluster-rolebinding
  namespace: default
subjects:
- kind: ServiceAccount
  name: admin # Name is case sensitive
  namespace: default
roleRef:
  kind: ClusterRole
  name: admin-role # Refers to the built-in cluster-admin ClusterRole
  apiGroup: rbac.authorization.k8s.io

